{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-box">

        <h1>Login</h1>

        <p class="subtitle">
            Login to your Resume Builder
        </p>

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn full"
            >
                Login
            </button>

        </form>


        <p class="bottom-text">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
